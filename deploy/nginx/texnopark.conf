# /etc/nginx/sites-available/texnopark  (domen: yoshlar-texnoparki.uz)
# HTTPS sertifikatini certbot qo'shadi: sudo certbot --nginx -d yoshlar-texnoparki.uz -d www.yoshlar-texnoparki.uz

server {
    listen 80;
    server_name yoshlar-texnoparki.uz www.yoshlar-texnoparki.uz;

    # Admin panel orqali rasm yuklash uchun
    client_max_body_size 10M;

    # Django static (admin panel) va yuklangan rasmlar — to'g'ridan-to'g'ri diskdan
    location /static/ {
        alias /opt/texnopark/data/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/texnopark/data/media/;
        expires 7d;
        access_log off;
    }

    # Django: admin panel va REST API
    location ~ ^/(admin|api)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        # $remote_addr bilan almashtiriladi — mijoz o'z IP'sini soxtalashtira olmaydi (spam cheklovi)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js sayt
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
