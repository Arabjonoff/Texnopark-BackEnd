# Production: backend (Django + gunicorn) va frontend (Next.js) konteynerlari.
# Serverdagi papkalar tuzilishi (batafsil: docs/DEPLOY.md):
#   /opt/texnopark/Texnopark-Back    <- shu repo
#   /opt/texnopark/Texnopark-Front   <- frontend repo
#   /opt/texnopark/data              <- baza, media, static (deploy'lar orasida saqlanadi)
#
# Ishga tushirish: docker compose -f deploy/docker-compose.yml up -d --build

name: texnopark

services:
  backend:
    build:
      context: ..
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
    volumes:
      - ${DATA_DIR:-/opt/texnopark/data}/db:/app/data
      - ${DATA_DIR:-/opt/texnopark/data}/media:/app/media
      - ${DATA_DIR:-/opt/texnopark/data}/static:/app/staticfiles
    # Faqat serverning o'zidan ochiq (Nginx va frontend build shu port orqali ulanadi).
    # Serverda 8000/3000 boshqa loyiha tomonidan band — shuning uchun 8010/3010.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/statistics/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../Texnopark-Front}
      # Build paytida sahifalar ishlab turgan backend'dan ma'lumot oladi
      network: host
      args:
        API_URL: http://127.0.0.1:${BACKEND_PORT:-8010}/api
    environment:
      # Ishlash paytida backend'ga Docker ichki tarmog'i orqali murojaat qilinadi
      API_URL: http://backend:8000/api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
